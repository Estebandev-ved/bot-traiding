name: breakout-bot

# Corre UN ciclo del paper trader "Breakout 4h" cada 4 horas (9 min después del cierre de cada vela de 4h).
# El estado y el modelo viven en Firestore (bot_state/breakout*), así que no importa que el disco de Actions se borre.
# OJO: GitHub solo ejecuta los horarios (cron) desde la rama por defecto del repositorio (main).
# Usa el MISMO secreto FIREBASE_SERVICE_ACCOUNT que richy-bot (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "9 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breakout-bot
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-breakout.txt

      - run: pip install -r requirements-breakout.txt

      - name: Ciclo Breakout 4h (paper)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions)"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # Los datos de mercado se piden a data-api.binance.vision (api.binance.com devuelve 451 desde EE. UU.).
          python paper_trader.py run --cloud
